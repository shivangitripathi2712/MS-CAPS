# MS-CAPS configuration
# =====================
# Settings used for the paper. Every key below is read by the code.
#
# Distortion (computed on text-only FLUX reconstructions):
#   Q_img = (CLIP-I + DINOv2 + (1 - LPIPS)) / 3
#   Q_cap = 0.5 * BERTScore(c, c') + 0.5 * CLIPScore(c', I)
#   Q_KG  = 0.4 * R_obj + 0.3 * R_attr + 0.3 * R_rel   (soft recall, KG of G(c') vs KG_I)
#   D     = alpha * (1 - Q_img) + beta * (1 - Q_cap) + gamma * (1 - Q_KG)
#   D_0   = same, for the full caption (beta term is 0 because Q_cap(c, c) = 1)
#   delta = (1 + epsilon) * D_0
#
# Gate (all must hold): C1 Q_img >= tau_img, C2 Q_cap >= tau_cap,
#                       C3 Q_KG >= tau_kg,   C4 D <= delta
#
# If no candidate passes, the original caption is kept.
#
# Calibration note: FLUX never sees the original image, so even the full caption
# gives only moderate Q_img. Thresholds are set for that range.

paths:
  output_dir: "./outputs"

dataset:
  # Folder layout: <data_dir>/<images_subdir>/<id>.jpg and
  #                <data_dir>/<captions_subdir>/<id>.txt  (matched by file name)
  local:
    data_dir: "./inputs"
    images_subdir: "vehicle_image_dataset/indian_vehicle_images/indian_vehicle_images"
    captions_subdir: "vehicle_image_dataset/generated_captions"
  max_samples: null          # null = all; override with --max-samples N
  min_caption_tokens: 30     # skip captions shorter than this

scene_graph:
  vlm:
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    device: "cuda:0"
    dtype: "float16"
    max_new_tokens: 1024
    temperature: 0.0
    do_sample: false
  max_objects: 50
  max_relations: 80

rewriter:                    # default rewriter = Qwen2.5-VL (text-only)
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 512

anchors:
  max_kg_anchors: 6
  kg_match_threshold: 0.55

t2i:
  backend: "flux"
  model: "black-forest-labs/FLUX.1-dev"
  device: "cuda:1"
  dtype: "bfloat16"
  image_size: 512
  num_inference_steps: 20
  guidance_scale: 3.5
  max_sequence_length: 512
  seeds: [42]

  # "text_only" (used in the paper) or "controlnet" (layout from the original
  # image via a shared canny/depth map; optional extension).
  mode: "text_only"
  structure_conditioning:
    enabled: false
    control_type: "canny"    # "canny" | "depth"
    controlnet_model: "Shakker-Labs/FLUX.1-dev-ControlNet-Union-Pro"
    control_mode: null       # null = auto for Union models (canny=0, depth=2)
    depth_model: "depth-anything/Depth-Anything-V2-Small-hf"
    canny_low: 100
    canny_high: 200

distortion:
  use_relative_threshold: true
  epsilon: 1.5               # delta = (1 + epsilon) * D_0 (paper setting)
  absolute_threshold: null   # no extra cap on delta (paper setting)
  weights:
    alpha_img: 0.4
    beta_cap: 0.2            # value used for the paper results
    gamma_kg: 0.4
  use_soft_kg: true          # embedding-based KG matching ("motorbike" ~ "motorcycle")
  clip:
    model: "ViT-L-14"
    pretrained: "openai"
    device: "cuda:0"
  dino:
    model: "dinov2_vitb14"
  lpips:
    net: "alex"
  bertscore:
    model: "microsoft/deberta-xlarge-mnli"
  kg:
    object_weight: 0.4
    attribute_weight: 0.3
    relation_weight: 0.3

gate:
  tau_img: 0.30
  tau_cap: 0.20
  tau_kg: 0.30

compression:
  max_iterations: 2
  num_candidates_per_iteration: 5
  # Token budgets as fractions of the original caption length (paper: rho).
  budget_ratios: [0.15, 0.25, 0.35, 0.45, 0.55]
  # Optional retry budgets if nothing passes; empty = no retry (paper setting).
  escalation_ratios: []
  # Optional minimum length:
  #   max(min_caption_tokens, min_target_tokens, round(min_target_ratio * original_tokens))
  min_target_ratio: 0.0
  min_target_tokens: 0
  min_caption_tokens: 5
  require_strict_compression: true
  # Among passing candidates, pick the shortest one whose quality_metric is
  # within quality_margin of the best passing candidate.
  select_by_quality: true
  quality_metric: "Q_img"
  quality_margin: 0.05

baseline_gate:               # skip samples whose full caption reconstructs poorly
  min_baseline_kg_f1: 0.05
  min_baseline_object_recall: 0.10

fidelity_floors:
  kg_f1_floor_drop: 0.08
  object_recall_floor_drop: 0.05
  attribute_recall_floor_drop: 0.12
  attribute_recall_min_floor: 0.10

fallback:
  strategy: "keep_original"   # paper setting; or "best_candidate"

evaluation:
  save_intermediate: true    # save reconstructions, KGs, and candidates per sample

seed: 42
